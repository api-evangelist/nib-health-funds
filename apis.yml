name: nib
kind: company
description: >-
  nib holdings limited (ASX:NHF), trading as nib, is an Australian private
  health insurer headquartered in Newcastle, New South Wales, and one of the country's
  largest health funds alongside Medibank, Bupa and HCF. Its lines of business span
  Australian residents health insurance, New Zealand health insurance through nib nz
  insurance limited, international workers and overseas student health cover (OSHC),
  travel insurance, and nib Thrive, its National Disability Insurance Scheme plan-management
  arm. As a private health insurer it is regulated by APRA and the Private Health Insurance
  Act rather than by an open-data mandate — Australia's Consumer Data Right was designated
  to extend to general insurance and then deferred, and it never reached private health
  insurance at all, so there is no regulatory forcing function pushing nib toward public
  APIs. Its API posture reflects that exactly: nib publishes no public, self-serve
  developer portal and no downloadable OpenAPI definitions. Probes of developer.nib.com.au,
  developers.nib.com.au, docs.nib.com.au and api.nib.com.au do not resolve, and /developers,
  /api, /developer, /partners and /integrations on nib.com.au all return 404. A real
  AWS API Gateway host, api-gateway.nib.com.au, is referenced by nib's own web front-end
  Content-Security-Policy and answers anonymously with HTTP 403 {"message":"Forbidden"},
  confirming a first-party, credential-gated gateway with no public documentation. Healthcare
  provider integration runs through the login-walled nib HCP portal and through third-party
  claiming terminals — HICAPS and HealthPoint — plus Honeysuckle Health for medical
  network and MediGap registration, not through an nib-published API. Member identity
  is an Auth0-backed OpenID Connect tenant at id.nib.com.au whose discovery document
  is publicly readable, as is an RFC 9116 security.txt at www.nib.com.au naming
  security@nib.com.au. nib also publishes three first-party npm scopes (@nib, @nib-styles,
  @nib-components) across four public GitHub organisations, but they carry frontend
  and DevOps tooling rather than any API client library. nib is recorded here as an
  honest partner-gated stub.
