apis:
- aid: nib-health-funds:identity
  name: nib Identity (OpenID Connect)
  description: >-
    The Auth0-backed OpenID Connect tenant behind nib member sign-in, issuer
    https://id.nib.com.au/. It is the only nib API surface with anonymously readable,
    machine-readable metadata: the OIDC discovery document, the RFC 8414 authorization-server
    metadata and the JWKS all return HTTP 200 without credentials, and the protected
    endpoints (/userinfo, /oauth/token) return 401 to anonymous callers. It supports
    authorization code with PKCE (S256), client credentials, device code, token exchange,
    JWT bearer, refresh, implicit and password grants, plus DPoP (ES256), CIBA backchannel
    authentication, backchannel logout and dynamic client registration. This is CONSUMER
    SIGN-IN identity, not a product API — it publishes only the 14 standard OIDC/Auth0
    identity scopes and no policy, claims, quote, member-data or partner scopes. nib's
    actual product APIs sit behind api-gateway.nib.com.au, which returns 403 to every
    anonymous request and publishes nothing. A sibling tenant serves nib New Zealand
    at https://id.nib.co.nz/.
  humanURL: https://my.nib.com.au/login
  baseURL: https://id.nib.com.au
