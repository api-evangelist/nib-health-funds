note: |
  IMPORTANT — none of these are API client libraries. nib publishes no public
  API and therefore no SDK. What it does publish, under three real first-party
  npm scopes and four public GitHub organisations, is a decade of internal
  frontend and DevOps tooling: an AngularJS/React component and style system
  (@nib-components, @nib-styles), build tooling, AWS housekeeping utilities and
  Australian-specific validators. They are catalogued here because they are
  genuinely first-party published packages, not because they help anyone
  integrate with nib.

  Consequently NO `SDKs` pointer is emitted in apis.yml — the sdk_count check
  must not fire on frontend widgets. Only a `Packages` pointer is wired.
