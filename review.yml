  acordPosture: no ACORD reference found
  acordNote: |
    No reference to ACORD, AL3, ACORD XML, NGDS, ACORD certification, or ACORD
    APIs was found anywhere on nib.com.au, in its 1,445-URL sitemap, or in the
    public nib-health-funds GitHub organisation. This is expected and structural
    rather than a gap: ACORD is a property-and-casualty and life data standard,
    and Australian private health insurance runs on an entirely different set of
    rails — Medicare's ECLIPSE for in-hospital and medical claiming, and HICAPS
    and HealthPoint terminals for ancillary/extras claiming, with APRA and the
    Private Health Insurance Act supplying the reporting regime. nib names
    HICAPS and HealthPoint explicitly on its provider pages. The sector-standard
    equivalent of an ACORD posture, for this carrier, is "third-party claiming
    terminal, no carrier-published API".
  insuranceVerbs:
    quote:
      exposed: false
      note: Quote and join flows are consumer web funnels on nib.com.au. The underlying
        pricing service (nibnz-api-pricing-api.secure.nib-api.com.au, named in the nib NZ
        CSP) is first-party and undocumented; root probe returns 404.
    bind:
      exposed: false
    issue:
      exposed: false
    fnol:
      exposed: false
      note: Claims are lodged by members through my.nib.com.au or by providers through
        HICAPS/HealthPoint terminals and the HCP portal. No public claims API.
    audience: none public; provider-facing integration is partner/agent-gated
  authModel:
    scheme: OAuth2 / OpenID Connect (Auth0 tenant) for member sign-in
    issuer: https://id.nib.com.au/
    discovery: https://id.nib.com.au/.well-known/openid-configuration
    discoveryStatus: 200
    grantTypesSupported:
    - client_credentials
    - authorization_code
    - refresh_token
    - password
    - implicit
    - urn:ietf:params:oauth:grant-type:device_code
    - urn:ietf:params:oauth:grant-type:token-exchange
    - urn:ietf:params:oauth:grant-type:jwt-bearer
    scopesSupported:
    - openid
    - profile
    - offline_access
    - name
    - given_name
    - family_name
    - nickname
    - email
    - email_verified
    - picture
    - created_at
    - identities
    - phone
    - address
    note: |
      Standard Auth0 identity scopes only — no product, policy, claims, or
      partner scopes are published. The API gateway at api-gateway.nib.com.au
      rejects anonymous requests with 403 and exposes no auth metadata.
      Provider-side access is a username/password portal login.
