    scheme: https
    baseURL: https://api-gateway.nib.com.au
    documented: false
    public: false
    note: Real first-party AWS API Gateway named in nib's own Content-Security-Policy.
      Anonymous requests return 403 {"message":"Forbidden"}. No published documentation.
  - protocol: OIDC
    scheme: https
    baseURL: https://id.nib.com.au
    documented: true
    public: true
    note: Auth0 member identity tenant; discovery document is anonymously readable.
      Consumer sign-in only, not a product API.
  - protocol: Terminal / EFTPOS claiming
    scheme: proprietary
    documented: false
    note: HICAPS and HealthPoint point-of-service terminals carry ancillary claims
      into nib. Third-party rails, not an nib-published interface.
  - protocol: GraphQL
