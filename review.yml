actions:
  status: built-stub
  apisListed: 0
  specsSaved: 0
  reason: |
    nib exposes no public, self-serve API surface. Recording the absence
    accurately — a live but 403-gated first-party gateway, a provider login
    wall, third-party claiming terminals, and an identity tenant — is the
    correct outcome for this carrier and for the Australian private health
    insurance market, where the Consumer Data Right never arrived and no open
    insurance obligation exists.
