aid: nib-health-funds
name: nib
review:
  question: Does nib publish a public, self-serve developer portal or downloadable
    OpenAPI definitions for its Australian private health insurance business?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: Australia
  tier: carrier-life-health
  gated: true
findings:
  summary: |
    nib holdings limited (ASX:NHF) publishes no public developer portal and no
    downloadable API definitions. Every conventional developer host was probed
    and none resolves: developer.nib.com.au, developers.nib.com.au,
    docs.nib.com.au and api.nib.com.au all fail DNS resolution (curl exit /
    HTTP 000). Every conventional developer path on the marketing site returns
    404: /developers, /api, /developer, /partners, /integrations. The published
    sitemap index (https://www.nib.com.au/sitemap.xml, 200) expands to 1,445
    URLs and contains no developer, API, or integration documentation page of
    any kind.

    A real first-party API gateway does exist and is credential-gated. nib's own
    web front-end Content-Security-Policy names api-gateway.nib.com.au (and the
    non-production api-gateway.nib-cf-test.com). Probed anonymously, both answer
    HTTP 403 with body {"message":"Forbidden"} — an AWS API Gateway with no
    public documentation, no /openapi.json, /swagger.json, /docs or /api-docs
    (all 403), and no anonymous discovery. This is the honest shape of the
    surface: real internal APIs, zero public developer surface.

    Healthcare provider integration is a login wall plus third-party terminals.
    The nib HCP portal (https://www.nib.com.au/providers/hcp-portal/user/login,
    200) is an authenticated provider portal, not a developer portal. nib's
    ancillary provider pages direct practitioners to HICAPS and HealthPoint
    terminals for electronic claiming and to Honeysuckle Health
    (register.honeysucklehealth.com.au) for medical network and MediGap
    registration. Claims enquiries route to providers@nib.com.au and a phone
    number. No API, SDK, or specification is offered to providers.

    nib does operate a public GitHub organisation, https://github.com/nib-health-funds
    (51 public repositories, org created 2014-06-19). Its contents are frontend
    and DevOps utilities — tradie, gulp-rev-delete-original, hammertime, robin,
    cfn-batman, validate-medicare, schema-validator — with no OpenAPI, AsyncAPI,
    or product API specification published. The repository literally named
    api-integration is a single-commit, README-only repo with no specification
    in it.

    The one genuinely public machine-readable artifact is identity, not product.
    nib's member login (https://my.nib.com.au/login) redirects to issuer
    https://id.nib.com.au/, an Auth0-backed OpenID Connect tenant whose discovery
    document is anonymously readable at HTTP 200. It is a consumer sign-in
    tenant, not a partner API authorization server with published product scopes,
    so no apis[] entry is claimed for it.
  developerPortal:
